{% extends 'students/base.html' %}

{% block title %}
    All Students
{% endblock %}


{% block content %}

    <h2>Students</h2>

    <ul>

        {% for student in students %}

            <li>
                <a href="{% url 'student_detail' student.id %}">
                    {{ student.name }}
                </a>
            </li>

        {% empty %}

            <li>No students found.</li>

        {% endfor %}

    </ul>

{% endblock %}
