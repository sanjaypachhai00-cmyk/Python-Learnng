{% extends 'students/base.html' %}

{% block title %}
    Add Student
{% endblock %}


{% block content %}

    <h2>Add New Student</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Student
        </button>

    </form>

    <a href="{% url 'all_students' %}">
        Back to Students
    </a>

{% endblock %}
